<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelNest</title>

    <link rel="icon" href="images/favicon.png">

    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="loader">

    <div class="spinner"></div>

</div>
    <header>
        <nav class="navbar">
            <h1 class="logo">TravelNest</h1>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="explorer.html">Explorer</a></li>
                <li><a href="budget.html">Budget</a></li>
                <li><a href="random.html">Random Trip</a></li>
                <li><a href="mood.html">Travel Mood</a></li>
                <li><a href="feedback.html">Feedback</a></li>
            </ul>

            <div class="hamburger">
                ☰
            </div>

            <button id="darkModeBtn">
                🌙
            </button>

        </nav>
    </header>
    <section class="hero reveal">

        <div class="hero-text">
            <h2>Explore The World With TravelNest</h2>
            <p>
                Discover amazing destinations, plan trips,
                and create unforgettable memories.
            </p>

            <button>Start Exploring</button>
        </div>

        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                 alt="Travel Image">
        </div>

    </section>
    <section class="destination-day reveal">

        <h2>Destination of the Day</h2>

        <div class="destination-box">
            <h3 id="destination-name"></h3>
            <p id="destination-description"></p>
        </div>

    </section>

<footer class="footer">

    <h2>TravelNest</h2>

    <p>Subscribe to our travel newsletter</p>

    <form id="newsletter-form">

        <input type="email"
               id="newsletter-email"
               placeholder="Enter your email"
               required>

        <button type="submit">Subscribe</button>

    </form>

</footer>

<button id="topBtn">
    ↑
</button>

<script src="js/app.js"></script>
<script src="js/common.js"></script>

</body>
</html>
